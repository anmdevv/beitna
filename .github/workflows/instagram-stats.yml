name: Beitna Instagram Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: read

concurrency:
  group: beitna-instagram-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: github-instagram-bot
    env:
      BEITNA_SITE_URL: ${{ secrets.BEITNA_SITE_URL }}
      BEITNA_CRON_SECRET: ${{ secrets.BEITNA_CRON_SECRET }}
      INSTAGRAM_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
      BATCH_LIMIT: '75'
      FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: github-instagram-bot/package.json

      - name: Install bot
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Refresh Instagram statistics
        run: npm run sync
